{{- with .Values.gatewayRoute }}
{{- if .enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "kc-spring-demo.fullname" $ }}-route
spec:
  parentRefs:
    - name: {{ .parentRef.name }}
      {{- with .parentRef.namespace }}
      namespace: {{ . | quote }}
      {{- end }}
      {{- with .parentRef.sectionName }}
      sectionName: {{ . | quote }}
      {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: {{ .path | quote }}
      backendRefs:
        - name: {{ include "kc-spring-demo.fullname" $ }}-service
          port: {{ $.Values.service.port }}
{{- end }}
{{- end }}
